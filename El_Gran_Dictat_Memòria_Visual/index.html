        // --- BANC DE PARAULES PER DEFECTE (Mètode Gabarró) ---
        const RAW_WORDS = [
          "a vegades", "àvia", "avi", "cavall", "aprovar", "bonic", "bonica", "aquí", "bitllet",
          "assignatura", "avui", "avió", "blanc", "avançar", "allí", "arribar", "botiga", "aventura",

          "equivocar", "paraigües", "rellotge", "història", "sempre", "entrepà", "temps", "verd",
          "també", "alcohol", "vacances", "vull", "vosaltres", "aigua", "aigües", "vermell"

        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        // --- ALGORITME DE CÀLCUL DE DIFICULTAT LINGÜÍSTICA (CATALÀ) ---
        const getWordDifficulty = (word) => {
          if (!word) return 0;
          let score = word.length * 1.0; // base en longitud
          
          const countOccurrences = (str, pattern) => (str.match(pattern) || []).length;
          
          // Accents tònics (à, è, é, í, ò, ó, ú)
          score += countOccurrences(word, /[àèéíòóú]/gi) * 1.5;
          // Dièresis (ï, ü)
          score += countOccurrences(word, /[ïü]/gi) * 3.0;
          // Ce trencada (ç)
          score += countOccurrences(word, /[ç]/gi) * 3.0;
          // H muda (h)
          score += countOccurrences(word, /[h]/gi) * 2.0;
          // L geminada (l·l, l.l, l-l)
          score += countOccurrences(word, /l[·\.\-]l/gi) * 4.0;
          // Lletra X
          score += countOccurrences(word, /[x]/gi) * 1.5;
          
          // Dígrafs i combinacions complexes en català
          const digraphs = ['ny', 'ix', 'tg', 'tj', 'tx', 'ig', 'rr', 'ss', 'qu', 'gu'];
          digraphs.forEach(dg => {
            score += countOccurrences(word, new RegExp(dg, 'gi')) * 1.5;
          });
          
          // Espais (expressions de dues o més paraules)
          score += countOccurrences(word, /\s/g) * 3.0;
          
          return score;
        };

        // --- CLASSIFICACIÓ EN TRES GRUPS (FÀCIL, MITJÀ, DIFÍCIL) ---
        const classifyWords = (wordObjects) => {
          // Filtrar manualment assignades pels docents
          const manual1 = wordObjects.filter(w => Number(w.difficulty) === 1);
          const manual2 = wordObjects.filter(w => Number(w.difficulty) === 2);
          const manual3 = wordObjects.filter(w => Number(w.difficulty) === 3);
          
          // Paraules automàtiques
          const autoWords = wordObjects.filter(w => w.difficulty === null || ![1, 2, 3].includes(Number(w.difficulty)));
          
          // Calcular puntuació dels automàtics i ordenar
          const scoredAuto = autoWords.map(w => ({
            word: w.word,
            score: getWordDifficulty(w.word)
          })).sort((a, b) => a.score - b.score);
          
          const totalAuto = scoredAuto.length;
          let easy = manual1.map(w => w.word);
          let medium = manual2.map(w => w.word);
          let hard = manual3.map(w => w.word);
          
          // Repartició equilibrada basant-se en percentils: fàcil (45%), mitjà (35%), difícil (20%)
          scoredAuto.forEach((item, idx) => {
            if (idx < totalAuto * 0.45) {
              easy.push(item.word);
            } else if (idx < totalAuto * 0.80) {
              medium.push(item.word);
            } else {
              hard.push(item.word);
            }
          });
          
          // Salvaguarda en cas de llistes molt curtes (fallbacks)
          const allWords = wordObjects.map(w => w.word);
          if (easy.length === 0) easy = allWords;
          if (medium.length === 0) medium = allWords;
          if (hard.length === 0) hard = allWords;
          
          return { easy, medium, hard };
        };

        // --- COMPONENTS D'ANIMACIÓ ---
        const Confetti = () => (
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-50">
            {[...Array(80)].map((_, i) => (

          </div>
        );

        const FloatingFeedback = ({ message, type, id }) => {
          const color = type === 'success' ? 'text-green-400' : type === 'rebound' ? 'text-orange-400' : 'text-red-400';
          return (
            <div key={id} className={`fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-7xl font-black ${color} z-50 pointer-events-none animate-floatUp drop-shadow-2xl`}>
              {message}
              <style>{`
                @keyframes floatUp {
                  0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
                  50% { transform: translate(-50%, -100%) scale(1.2); }
                  100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
                }
                .animate-floatUp { animation: floatUp 1.2s ease-out forwards; }
              `}</style>

        function App() {
          // --- CONFIGURACIÓ DE PARAULES (LOCAL STORAGE HÍBRID) ---
          const [wordSource, setWordSource] = useState(() => {
            return localStorage.getItem('gabarro_word_source') || 'default';
          });
          const [customWords, setCustomWords] = useState(() => {
            try {
              const saved = localStorage.getItem('gabarro_custom_words');
              if (!saved) return [];
              const parsed = JSON.parse(saved);
              // Migració d'estructures antigues a objectes amb dificultat
              return parsed.map(item => {
                if (typeof item === 'string') {
                  return { word: item, difficulty: null };
                }
                return {
                  word: item.word,
                  difficulty: item.difficulty !== undefined ? (item.difficulty !== null ? Number(item.difficulty) : null) : null
                };
              });
            } catch (e) {
              return [];
            }
          });
          
          // Banc actiu format per objectes { word, difficulty }
          const activeWordObjects = useMemo(() => {
            if (wordSource === 'default') {
              return RAW_WORDS.map(w => ({ word: w, difficulty: null }));
            } else {
              return customWords;
            }
          }, [wordSource, customWords]);

          // --- CONFIGURACIÓ DE LA VEU I VELOCITAT ---
          const [speechRate, setSpeechRate] = useState(() => {
            const saved = localStorage.getItem('gabarro_speech_rate');
            return saved ? Number(saved) : 0.85; // lleugerament pausat per defecte
          });
          const [selectedVoiceName, setSelectedVoiceName] = useState(() => {
            return localStorage.getItem('gabarro_selected_voice') || '';
          });
          const [voices, setVoices] = useState([]);

          // Guardar opcions de veu a localStorage
          useEffect(() => {
            localStorage.setItem('gabarro_speech_rate', speechRate);
          }, [speechRate]);

          useEffect(() => {
            if (selectedVoiceName) {
              localStorage.setItem('gabarro_selected_voice', selectedVoiceName);
            }
          }, [selectedVoiceName]);

          // Càrrega i filtre de veus catalanes
          const updateVoices = useCallback(() => {
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              const allVoices = window.speechSynthesis.getVoices();
              const caVoices = allVoices.filter(v => v.lang.toLowerCase().includes('ca') || v.lang.toLowerCase().includes('cat'));
              setVoices(caVoices);
              
              if (caVoices.length > 0) {
                const savedVoice = localStorage.getItem('gabarro_selected_voice');
                const exists = caVoices.some(v => v.name === savedVoice);
                if (exists && savedVoice) {
                  setSelectedVoiceName(savedVoice);
                } else {
                  // Prioritzar la veu en línia Google català per sobre de les de l'OS
                  const googleVoice = caVoices.find(v => v.name.toLowerCase().includes('google'));
                  const defaultVoice = googleVoice || caVoices[0];
                  setSelectedVoiceName(defaultVoice.name);
                }
              }
            }
          }, []);

          // Escolta asíncrona robusta d'alta compatibilitat per a Chrome/Safari
          useEffect(() => {
            updateVoices();
            
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              window.speechSynthesis.addEventListener('voiceschanged', updateVoices);
            }

            // Fallback de seguretat 500ms després de muntar el component (molt útil per a Chrome en local)
            const timer = setTimeout(() => {
              updateVoices();
            }, 500);

            return () => {
              if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
                window.speechSynthesis.removeEventListener('voiceschanged', updateVoices);
              }
              clearTimeout(timer);
            };
          }, [updateVoices]);

          // --- ESTAT DEL JOC ---
          const [phase, setPhase] = useState(0); 
          const [scoreA, setScoreA] = useState(0);
          const [scoreB, setScoreB] = useState(0);
          
          // Llistes partides per dificultat activa
          const [phase1Words, setPhase1Words] = useState([]);
          const [phase2Words, setPhase2Words] = useState([]);
          const [phase3Words, setPhase3Words] = useState([]);
          
          // Llista de joc de la fase actual (es barreja a l'inici d'aquesta)
          const [words, setWords] = useState([]);
          const [wordIndex, setWordIndex] = useState(0);
          
          const [failedWords, setFailedWords] = useState([]);
          const [feedbacks, setFeedbacks] = useState([]);

          // --- CONFIGURACIÓ D'AUDIO ---
          const [isSoundEnabled, setIsSoundEnabled] = useState(() => {
            const saved = localStorage.getItem('gabarro_sound_enabled');
            return saved !== 'false';
          });

          // --- GESTIÓ INTERFÍCIE EDITORA ---
          const [isWordManagerOpen, setIsWordManagerOpen] = useState(false);
          const [newWordInput, setNewWordInput] = useState('');
          const [searchQuery, setSearchQuery] = useState('');

          // --- ESTAT FASE 1 ---
          const [timeLeft, setTimeLeft] = useState(120);
          const [isTimerRunning, setIsTimerRunning] = useState(false);
          const [f1Turn, setF1Turn] = useState('A');

          // --- ESTAT FASE 2 ---
          const [f2Turn, setF2Turn] = useState('A');
          const [playerA, setPlayerA] = useState(1);
          const [playerB, setPlayerB] = useState(1);
          const [isRebounded, setIsRebounded] = useState(false);

          // --- ESTAT FASE 3 ---
          const [f3WordsPlayed, setF3WordsPlayed] = useState(0);
          const [wordRevealed, setWordRevealed] = useState(false);
          const [f3WordScored, setF3WordScored] = useState({ A: false, B: false });

          // Classificació prèvia activa per conèixer els badges de l'editor
          const classifiedActive = useMemo(() => {
            return classifyWords(activeWordObjects);
          }, [activeWordObjects]);

          // --- SINTETITZADOR DE SO (WEB AUDIO API) ---
          const playSound = useCallback((type) => {
            if (!isSoundEnabled) return;
            try {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              if (!AudioContext) return;
              const ctx = new AudioContext();
              if (ctx.state === 'suspended') {
                ctx.resume();
              }
              
              if (type === 'correct') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
              } else if (type === 'incorrect') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
              } else if (type === 'rebound') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
              } else if (type === 'timeup') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.setValueAtTime(330, ctx.currentTime + 0.15);
                osc.frequency.setValueAtTime(440, ctx.currentTime + 0.3);
                osc.frequency.setValueAtTime(330, ctx.currentTime + 0.45);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
              } else if (type === 'victory') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                  const osc = ctx.createOscillator();
                  const gain = ctx.createGain();
                  osc.connect(gain);
                  gain.connect(ctx.destination);
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                  gain.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.1);
                  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.35);
                  osc.start(ctx.currentTime + idx * 0.1);
                  osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
                });
              }
            } catch (e) {
              console.error("Audio Context Error:", e);
            }
          }, [isSoundEnabled]);

          // --- SINTETITZADOR DE VEU AMB AJUST DE VELOCITAT I PITCH ---
          const speakWord = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'ca-ES';
              utterance.rate = speechRate; // velocitat configurada
              utterance.pitch = 1.02; // tonalitat clara i amigable
              
              if (selectedVoiceName) {
                const voice = voices.find(v => v.name === selectedVoiceName);
                if (voice) utterance.voice = voice;
              } else {
                const caVoice = voices.find(v => v.lang.toLowerCase().includes('ca'));
                if (caVoice) utterance.voice = caVoice;
              }
              window.speechSynthesis.speak(utterance);
            } else {
              alert("El teu navegador no suporta la síntesi de veu.");
            }
          };

          // --- GESTIÓ DEL BANC DE PARAULES & PARSER DE MULTI-COLUMNA CSV ---
          const handleCSVUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
              const text = event.target.result;
              const lines = text.split(/\r?\n/);
              if (lines.length === 0) return;

              // Analitzar capçalera i separador (coma o punt i coma)
              const firstLine = lines[0].trim();
              const delimiter = firstLine.includes(';') ? ';' : ',';
              const headers = firstLine.split(delimiter).map(h => h.trim().toLowerCase().replace(/^["']|["']$/g, ''));

              // Comprovar si tenim columnes definides de dificultat (facil, mitja, dificil)
              const isMultiColumn = headers.some(h => 
                h.includes('facil') || h.includes('fàcil') || 
                h.includes('mitja') || h.includes('mitjà') || 
                h.includes('dificil') || h.includes('difícil')
              );

              const newWords = [];

              if (isMultiColumn) {
                // Mapejar cadascuna de les columnes al seu valor numeric de dificultat (1, 2, 3 o null)
                const colMappings = headers.map(h => {
                  if (h.includes('facil') || h.includes('fàcil') || h.includes('easy')) return 1;
                  if (h.includes('mitja') || h.includes('mitjà') || h.includes('medium')) return 2;
                  if (h.includes('dificil') || h.includes('difícil') || h.includes('hard')) return 3;
                  return null; // auto
                });

                // Començar a llista a partir de la línia index 1 (fila de dades)
                for (let i = 1; i < lines.length; i++) {
                  const line = lines[i].trim();
                  if (!line) continue;

                  const cells = line.split(delimiter);
                  cells.forEach((cell, colIdx) => {
                    if (colIdx >= colMappings.length) return;
                    
                    let word = cell.trim().replace(/^["']|["']$/g, '').trim();
                    if (word.length > 0) {
                      newWords.push({
                        word: word,
                        difficulty: colMappings[colIdx]
                      });
                    }
                  });
                }
              } else {
                // Mode tradicional (2 columnes: paraula,dificultat o 1 sola columna de paraula auto)
                lines.forEach((line, index) => {
                  let trimmed = line.trim();
                  if (!trimmed) return;

                  const parts = trimmed.split(delimiter);
                  let word = parts[0].trim().replace(/^["']|["']$/g, '').trim();
                  let diffVal = null;

                  if (parts.length > 1) {
                    const rawDiff = parts[1].trim().replace(/^["']|["']$/g, '').trim();
                    if (['1', '2', '3'].includes(rawDiff)) {
                      diffVal = Number(rawDiff);
                    }
                  }

                  // Ometre capçalera simple
                  if (index === 0 && (word.toLowerCase() === 'paraula' || word.toLowerCase() === 'word' || word.toLowerCase() === 'paraules')) {
                    return;
                  }

                  if (word.length > 0) {
                    newWords.push({ word, difficulty: diffVal });
                  }
                });
              }

              if (newWords.length === 0) {
                alert("No s'han trobat paraules vàlides. Revisa el format del fitxer CSV.");
                return;
              }

              setCustomWords(newWords);
              localStorage.setItem('gabarro_custom_words', JSON.stringify(newWords));
              setWordSource('custom');
              localStorage.setItem('gabarro_word_source', 'custom');
              addFeedback(`Importades ${newWords.length} paraules!`, 'success');
              playSound('correct');
            };
            reader.readAsText(file);
          };

          // Descarregar plantilla amb columnes per a cada dificultat
          const downloadTemplateCSV = () => {
            const csvContent = "facil,mitja,dificil,auto\navi,guerra,intel·ligència,blanc\nàvia,rebot,col·laborar,avió\nboca,deures,meravellós,veí\n";
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "plantilla_paraules_dictat.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          // Exportar en format multi-columna compatible i organitzat per columnes de dificultat
          const exportWordsCSV = () => {
            const easy = activeWordObjects.filter(w => w.difficulty === 1).map(w => w.word);
            const medium = activeWordObjects.filter(w => w.difficulty === 2).map(w => w.word);
            const hard = activeWordObjects.filter(w => w.difficulty === 3).map(w => w.word);
            const auto = activeWordObjects.filter(w => w.difficulty === null || ![1, 2, 3].includes(w.difficulty)).map(w => w.word);

            const maxLen = Math.max(easy.length, medium.length, hard.length, auto.length);
            let csvLines = ["facil,mitja,dificil,auto"];

            for (let i = 0; i < maxLen; i++) {
              const eVal = easy[i] || "";
              const mVal = medium[i] || "";
              const hVal = hard[i] || "";
              const aVal = auto[i] || "";
              csvLines.push(`${eVal},${mVal},${hVal},${aVal}`);
            }

            const blob = new Blob([csvLines.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `banc_paraules_${wordSource}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const exportErrorsCSV = () => {
            if (failedWords.length === 0) return;
            const header = "paraules_fallades\n";
            const content = failedWords.join("\n");
            const blob = new Blob([header + content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "paraules_fallades_dictat.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const handleManualAddWord = (e) => {
            e.preventDefault();
            const trimmed = newWordInput.trim();
            if (!trimmed) return;

            if (customWords.map(w => w.word.toLowerCase()).includes(trimmed.toLowerCase())) {
              alert("Aquesta paraula ja és a la llista.");
              return;
            }

            const diffInput = document.getElementById('manualDifficultySelect').value;
            const diffVal = diffInput ? Number(diffInput) : null;

            const updated = [...customWords, { word: trimmed, difficulty: diffVal }];
            setCustomWords(updated);
            localStorage.setItem('gabarro_custom_words', JSON.stringify(updated));
            setNewWordInput('');
            addFeedback("Afegida!", "success");
            playSound('correct');
          };

          const handleDeleteWord = (itemToDelete) => {
            const updated = customWords.filter(w => w.word !== itemToDelete.word);
            setCustomWords(updated);
            localStorage.setItem('gabarro_custom_words', JSON.stringify(updated));
            addFeedback("Eliminada", "error");
            playSound('incorrect');
          };

          const handleClearAllCustomWords = () => {
            if (confirm("Segur que vols esborrar TOTES les paraules personalitzades? Aquesta acció no es pot desfer.")) {
              setCustomWords([]);
              localStorage.setItem('gabarro_custom_words', JSON.stringify([]));
              addFeedback("Llista buidada", "error");
              playSound('incorrect');
            }
          };

          // --- FUNCIONS DEL JOC I TRANSICIONS ENTRE FASES ---
          const startGame = () => {
            if (activeWordObjects.length === 0) {
              alert("El banc de paraules està buit! Si us plau, afegeix paraules o utilitza la llista per defecte.");
              return;
            }
            
            // Classificar prèviament les paraules en 3 dificultats
            const { easy, medium, hard } = classifyWords(activeWordObjects);
            setPhase1Words(easy);
            setPhase2Words(medium);
            setPhase3Words(hard);

            // Carregar fàcils (Easy) per a la Fase 1
            const shuffledEasy = shuffleArray(easy);
            setWords(shuffledEasy);
            setWordIndex(0);
            
            setFailedWords([]);
            setScoreA(0);
            setScoreB(0);
            
            // Iniciar Fase 1
            setPhase(1);
            setTimeLeft(120);
            setIsTimerRunning(false);
            setF1Turn('A');
            
            setF2Turn('A');
            setPlayerA(1);
            setPlayerB(1);
            setIsRebounded(false);
            
            setF3WordsPlayed(0);
            setWordRevealed(false);
            setF3WordScored({ A: false, B: false });
 
            playSound('correct');
          };

          const transitionToPhase2 = () => {
            // Carregar mitjanes (Medium) per a la Fase 2
            const shuffledMedium = shuffleArray(phase2Words);
            setWords(shuffledMedium);
            setWordIndex(0);
            setF2Turn('A');
            setIsRebounded(false);
            setPhase(2);
            playSound('correct');
          };

          const transitionToPhase3 = () => {
            // Carregar difícils (Hard) per a la Fase 3
            const shuffledHard = shuffleArray(phase3Words);
            setWords(shuffledHard);
            setWordIndex(0);
            setF3WordsPlayed(0);
            setWordRevealed(false);
            setPhase(3);
            playSound('correct');
          };

          const goToPhase = (targetPhase) => {
            setIsTimerRunning(false);
            
            let easyList = phase1Words;
            let mediumList = phase2Words;
            let hardList = phase3Words;
            
            if (easyList.length === 0 && mediumList.length === 0 && hardList.length === 0 && activeWordObjects.length > 0) {
              const { easy, medium, hard } = classifyWords(activeWordObjects);
              easyList = easy;
              mediumList = medium;
              hardList = hard;
              setPhase1Words(easy);
              setPhase2Words(medium);
              setPhase3Words(hard);
            }
            
            if (targetPhase === 0) {
              setPhase(0);
              setScoreA(0);
              setScoreB(0);
              setFailedWords([]);
              setF3WordScored({ A: false, B: false });
            } else if (targetPhase === 1) {
              const shuffledEasy = shuffleArray(easyList.length > 0 ? easyList : ["prova1", "prova2"]);
              setWords(shuffledEasy);
              setWordIndex(0);
              setTimeLeft(120);
              setF1Turn('A');
              setPhase(1);
            } else if (targetPhase === 2) {
              const shuffledMedium = shuffleArray(mediumList.length > 0 ? mediumList : ["prova3", "prova4"]);
              setWords(shuffledMedium);
              setWordIndex(0);
              setF2Turn('A');
              setIsRebounded(false);
              setPhase(2);
            } else if (targetPhase === 3) {
              const shuffledHard = shuffleArray(hardList.length > 0 ? hardList : ["prova5", "prova6"]);
              setWords(shuffledHard);
              setWordIndex(0);
              setF3WordsPlayed(0);
              setWordRevealed(false);
              setF3WordScored({ A: false, B: false });
              setPhase(3);
            } else if (targetPhase === 4) {
              setPhase(4);
            } else if (targetPhase === 5) {
              setPhase(5);
            } else if (targetPhase === 6) {
              setPhase(6);
            }
            
            playSound('correct');
          };

          const addFeedback = (msg, type) => {
            const newFeedback = { id: Date.now(), msg, type };
            setFeedbacks(prev => [...prev, newFeedback]);
            setTimeout(() => setFeedbacks(prev => prev.filter(f => f.id !== newFeedback.id)), 1200);
          };

          const getNextWord = useCallback((failed = false) => {
            if (failed) {
              setFailedWords(prev => {
                if (!prev.includes(words[wordIndex])) return [...prev, words[wordIndex]];
                return prev;
              });
            }
            setWordIndex(prev => (prev + 1) % words.length);
          }, [words, wordIndex]);

          // Timer de la Fase 1
          useEffect(() => {
            let timer;
            if (isTimerRunning && timeLeft > 0) {
              timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
            } else if (timeLeft === 0 && isTimerRunning) {
              setIsTimerRunning(false);
              addFeedback("TEMPS!", "error");
              playSound('timeup');
            }
            return () => clearInterval(timer);
          }, [isTimerRunning, timeLeft, playSound]);

          // So de victòria a la pantalla final
          useEffect(() => {
            if (phase === 4) {
              playSound('victory');
            }
          }, [phase, playSound]);

          const handleF1Correct = () => {
            if (f1Turn === 'A') setScoreA(s => s + 10);
            else setScoreB(s => s + 10);
            addFeedback("+10", "success");
            playSound('correct');
            getNextWord(false);
          };

          const handleF1Incorrect = () => {
            addFeedback("ERRADA", "error");
            playSound('incorrect');
            getNextWord(true);
          };

          const switchF1Turn = () => {
            setF1Turn('B');
            setTimeLeft(120);
            setIsTimerRunning(false);
            playSound('correct');
          };

          const handleF2Correct = () => {
            if (f2Turn === 'A') setScoreA(s => s + 20);
            else setScoreB(s => s + 20);
            addFeedback("+20", "success");
            playSound('correct');
            
            if (f2Turn === 'A' || isRebounded) setPlayerA(p => p < 12 ? p + 1 : 1);
            if (f2Turn === 'B' || isRebounded) setPlayerB(p => p < 12 ? p + 1 : 1);
            
            setF2Turn(prev => prev === 'A' ? 'B' : 'A');
            setIsRebounded(false);
            getNextWord(false);
          };

          const handleF2Rebound = () => {
            addFeedback("REBOT!", "rebound");
            playSound('rebound');
            setF2Turn(prev => prev === 'A' ? 'B' : 'A');
            setIsRebounded(true);
            setFailedWords(prev => prev.includes(words[wordIndex]) ? prev : [...prev, words[wordIndex]]);
          };

          const handleF2Cancel = () => {
            addFeedback("ANUL·LADA", "error");
            playSound('incorrect');
            if (f2Turn === 'A') setPlayerA(p => p < 12 ? p + 1 : 1);
            else setPlayerB(p => p < 12 ? p + 1 : 1);
            
            setF2Turn(prev => prev === 'A' ? 'B' : 'A');
            setIsRebounded(false);
            getNextWord(true);
          };

          const handleF3ToggleA = () => {
            setF3WordScored(prev => {
              const nextState = !prev.A;
              if (nextState) {
                setScoreA(s => s + 30);
                addFeedback("+30 EQUIP A", "success");
                playSound('correct');
              } else {
                setScoreA(s => Math.max(0, s - 30));
                addFeedback("-30 EQUIP A", "error");
                playSound('incorrect');
              }
              return { ...prev, A: nextState };
            });
          };

          const handleF3ToggleB = () => {
            setF3WordScored(prev => {
              const nextState = !prev.B;
              if (nextState) {
                setScoreB(s => s + 30);
                addFeedback("+30 EQUIP B", "success");
                playSound('correct');
              } else {
                setScoreB(s => Math.max(0, s - 30));
                addFeedback("-30 EQUIP B", "error");
                playSound('incorrect');
              }
              return { ...prev, B: nextState };
            });
          };

          const handleF3Next = () => {
            if (f3WordsPlayed >= 5) {
              setPhase(4);
            } else {
              setF3WordsPlayed(p => p + 1);
              setWordRevealed(false);
              setF3WordScored({ A: false, B: false });
              getNextWord(false);
            }
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
          };

          const currentWord = words[wordIndex] || "Carregant...";

          // Filtratge de paraules per a l'editor visual
          const filteredWordsList = useMemo(() => {
            return activeWordObjects.filter(item => 
              item.word.toLowerCase().includes(searchQuery.toLowerCase())
            );
          }, [activeWordObjects, searchQuery]);

          return (
            <div className={`min-h-screen text-white font-sans transition-colors duration-500 relative flex flex-col ${phase === 3 && !wordRevealed ? 'bg-slate-955' : 'bg-transparent'}`}>
              
              {/* CAPÇALERA DEL JOC */}
              {phase > 0 && phase < 5 && (
                <header className="fixed top-0 w-full flex items-center justify-between px-8 py-4 bg-black/40 backdrop-blur-md z-40 border-b border-white/10">
                  <div className="flex flex-col items-center">
                    <span className="text-xl font-bold text-blue-300 tracking-wider">EQUIP A</span>
                    <span className="text-5xl font-black text-white drop-shadow-[0_0_15px_rgba(59,130,246,0.8)]">{scoreA}</span>
                  </div>
                  <div className="text-center flex-1">
                    <h1 className="text-3xl font-black tracking-widest text-yellow-400 uppercase drop-shadow-md">
                      {phase === 1 ? 'La Pluja de Lletres' : phase === 2 ? 'El Rebot' : phase === 3 ? 'La Gran Final' : 'Resultats'}
                    </h1>
                    <p className="text-indigo-200 text-sm font-medium tracking-widest mt-1 opacity-80">EL GRAN DICTAT</p>
                  </div>
                  <div className="flex items-center gap-4">
                    <div className="flex flex-col items-center">
                      <span className="text-xl font-bold text-red-400 tracking-wider">EQUIP B</span>
                      <span className="text-5xl font-black text-white drop-shadow-[0_0_15px_rgba(248,113,113,0.8)]">{scoreB}</span>
                    </div>
                    <button 
                      onClick={() => setIsSoundEnabled(prev => !prev)}
                      className="p-3 bg-white/5 hover:bg-white/15 rounded-full text-slate-300 hover:text-white transition-all"
                      title={isSoundEnabled ? "Silenciar efectes de so" : "Activar efectes de so"}
                    >
                      {isSoundEnabled ? <Volume2 size={24} /> : <VolumeX size={24} className="text-red-400" />}
                    </button>
                  </div>
                </header>
              )}

              {feedbacks.map(f => <FloatingFeedback key={f.id} message={f.msg} type={f.type} />)}

              <main className="pt-32 pb-32 flex-grow flex flex-col items-center justify-center px-4 w-full">
                
                {/* PANTALLA INICIAL (PHASE 0) */}
                {phase === 0 && (
                  <div className="w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center px-4 py-8">
                    
                    {/* COLUMNA ESQUERRA: TITOL I ACCIONS */}
                    <div className="lg:col-span-7 text-center lg:text-left flex flex-col justify-center animate-fade-in-up">
                      <div className="mb-8 relative inline-block self-center lg:self-start">
                        <h1 className="text-7xl md:text-8xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 via-yellow-500 to-orange-600 drop-shadow-2xl">
                          EL GRAN<br/>DICTAT
                        </h1>
                        <div className="absolute -top-6 right-0 lg:-right-10 text-6xl rotate-12">📝</div>
                      </div>
                      <p className="text-xl md:text-2xl text-indigo-200 mb-10 max-w-2xl leading-relaxed">
                        Benvinguts al gran concurs de lletreig i vocabulari de la classe. Les paraules augmenten de dificultat a cada fase!
                      </p>
                      
                      <div className="flex flex-wrap gap-4 justify-center lg:justify-start">
                          <button 
                            onClick={() => setPhase(6)}
                            className="px-8 py-4 bg-white/10 hover:bg-white/20 border-2 border-white/30 rounded-full font-bold text-lg uppercase tracking-widest transition-all hover:scale-105 backdrop-blur-md flex items-center gap-3"
                          >
                            <Info size={24} /> Instruccions
                          </button>
                          <button 
                            onClick={startGame}
                            className="group relative px-10 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full font-bold text-lg uppercase tracking-widest overflow-hidden shadow-[0_0_40px_rgba(79,70,229,0.5)] hover:shadow-[0_0_60px_rgba(79,70,229,0.8)] transition-all hover:scale-105"
                          >
                            <div className="absolute inset-0 w-full h-full bg-white/20 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-out"></div>
                            <span className="flex items-center gap-3 relative z-10">Començar el Joc <Play fill="currentColor" /></span>
                          </button>
                      </div>
                    </div>

                    {/* COLUMNA DRETA: CONFIGURACIÓ */}
                    <div className="lg:col-span-5 flex flex-col gap-6 justify-center w-full max-w-md mx-auto animate-fade-in-up">
                      
                      {/* CARD 1: CONFIGURACIÓ DE PARAULES */}
                      <div className="bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-3xl p-6 shadow-2xl text-left w-full">
                        <h3 className="text-xl sm:text-2xl font-black text-yellow-400 mb-5 flex items-center gap-2">
                          <Sliders className="text-yellow-400" size={24} />
                          Banc de Paraules
                        </h3>
                        
                        <div className="flex bg-slate-900/60 p-1 rounded-xl mb-4 border border-slate-700/50">
                          <button 
                            onClick={() => { setWordSource('default'); localStorage.setItem('gabarro_word_source', 'default'); }}
                            className={`flex-1 py-2 rounded-lg text-[10px] sm:text-xs font-bold transition-all uppercase tracking-wider ${wordSource === 'default' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                          >
                            Gabarró (Defecte)
                          </button>
                          <button 
                            onClick={() => { setWordSource('custom'); localStorage.setItem('gabarro_word_source', 'custom'); }}
                            className={`flex-1 py-2 rounded-lg text-[10px] sm:text-xs font-bold transition-all uppercase tracking-wider ${wordSource === 'custom' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                          >
                            Personalitzat
                          </button>
                        </div>
                        
                        <div className="mb-4 flex justify-between items-center text-xs sm:text-sm bg-slate-900/40 p-3 rounded-xl border border-slate-700/50">
                          <span className="text-slate-400 font-semibold">Paraules actives:</span>
                          <span className="text-lg font-black text-white bg-indigo-500/20 px-2.5 py-0.5 rounded-lg border border-indigo-500/30">
                            {activeWordObjects.length}
                          </span>
                        </div>
                        
                        <div className="space-y-3">
                          {wordSource === 'custom' && (
                            <div className="grid grid-cols-2 gap-2">
                              <label className="flex items-center justify-center gap-1.5 py-2 px-3 bg-blue-600/20 hover:bg-blue-600/35 border border-blue-500/30 text-blue-200 rounded-xl font-bold text-xs sm:text-sm cursor-pointer transition-all hover:scale-[1.02] active:scale-[0.98]" title="Puja un CSV organitzat per columnes de dificultat">
                                <Upload size={16} /> Importar CSV
                                <input type="file" accept=".csv" onChange={handleCSVUpload} className="hidden" />
                              </label>
                              <button 
                                onClick={exportWordsCSV}
                                disabled={activeWordObjects.length === 0}
                                className="flex items-center justify-center gap-1.5 py-2 px-3 bg-emerald-600/20 hover:bg-emerald-600/35 border border-emerald-500/30 text-emerald-200 rounded-xl font-bold text-xs sm:text-sm transition-all hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none"
                              >
                                <Download size={16} /> Exportar CSV
                              </button>
                            </div>
                          )}
                          
                          <div className="flex gap-2">
                            {wordSource === 'default' && (
                              <button 
                                onClick={exportWordsCSV}
                                className="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 bg-emerald-600/20 hover:bg-emerald-600/35 border border-emerald-500/30 text-emerald-200 rounded-xl font-bold text-xs sm:text-sm transition-all hover:scale-[1.02]"
                              >
                                <Download size={16} /> Exportar llista
                              </button>
                            )}
                            <button 
                              onClick={downloadTemplateCSV}
                              className="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 bg-slate-700/60 hover:bg-slate-700/90 border border-slate-650 text-slate-350 rounded-xl font-bold text-xs sm:text-sm transition-all hover:scale-[1.02] active:scale-[0.98]"
                              title="Plantilla de columnes: facil, mitja, dificil, auto"
                            >
                              <Download size={16} /> Plantilla CSV
                            </button>
                          </div>
                          
                          <div className="pt-1">
                            <button 
                              onClick={() => { setIsWordManagerOpen(true); playSound('correct'); }}
                              className="w-full py-3 bg-slate-900 hover:bg-slate-955 border border-slate-700 rounded-xl font-bold text-xs sm:text-sm text-slate-350 hover:text-white transition-all flex items-center justify-center gap-2 shadow-md"
                            >
                              👁️ Veure i editar les paraules
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* CARD 2: CONFIGURACIÓ DE LA VEU */}
                      <div className="bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-3xl p-6 shadow-2xl text-left w-full">
                        <h3 className="text-xl sm:text-2xl font-black text-yellow-400 mb-5 flex items-center gap-2">
                          <Volume2 className="text-yellow-400" size={24} />
                          Configuració del Dictat
                        </h3>
                        
                        <div className="mb-4">
                          <label className="text-slate-400 text-[10px] font-bold uppercase tracking-wider block mb-1.5">Veu de síntesi:</label>

                    <div className={`w-full min-h-[20rem] py-8 px-6 rounded-[3rem] flex flex-col md:flex-row items-center justify-center gap-12 border-4 shadow-2xl transition-all duration-700 mb-12 ${wordRevealed ? 'bg-indigo-600 border-indigo-400 shadow-[0_0_50px_rgba(79,70,229,0.5)]' : 'bg-slate-800 border-slate-700'}`}>
                      {!wordRevealed ? (
                        <div className="flex flex-col md:flex-row gap-12 items-center px-8">
                          
                          {/* Botó dictat a cegues */}
                          <button 
                            onClick={() => speakWord(currentWord)}
                            className="group flex flex-col items-center gap-4 text-yellow-400 hover:text-yellow-300 transition-colors"
                          >
                            <div className="p-6 bg-slate-700/50 group-hover:bg-slate-700 rounded-full transition shadow-md">
                              <Volume2 size={64} className="group-hover:scale-110 transition-transform duration-300"/>
                            </div>
                            <span className="text-xl font-bold tracking-widest uppercase">🔊 Dictar Paraula</span>
                          </button>

                          <div className="w-px h-24 bg-slate-750 hidden md:block"></div>

                          {/* Botó de revelació visual */}
                          <button 
                            onClick={() => { setWordRevealed(true); playSound('correct'); }}
                            className="group flex flex-col items-center gap-4 text-slate-400 hover:text-white transition-colors"
                          >
                            <div className="p-6 bg-slate-700/50 group-hover:bg-slate-700 rounded-full transition shadow-md">
                              <Eye size={64} className="group-hover:scale-110 transition-transform duration-300"/>
                            </div>
                            <span className="text-xl font-bold tracking-widest uppercase">👁️ Revelar Paraula</span>
                          </button>

                        </div>
                       ) : (
                        <div className="flex flex-col md:flex-row items-center justify-center gap-6 px-4 w-full">
                          <h2 className={`font-black text-white uppercase tracking-tighter drop-shadow-2xl animate-fade-in-up text-center break-words break-all ${
                            currentWord.length > 18 ? 'text-4xl sm:text-5xl md:text-6xl' :
                            currentWord.length > 14 ? 'text-5xl sm:text-6xl md:text-7xl' :
                            currentWord.length > 10 ? 'text-6xl sm:text-7xl md:text-8xl' :
                            'text-7xl sm:text-8xl md:text-[10rem]'
                          }`}>
                               {currentWord}
                           </h2>
                          <button 
                            onClick={() => speakWord(currentWord)}
                            className="p-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-full transition-all hover:scale-110 active:scale-95 text-yellow-400 hover:text-yellow-300 shrink-0"
                            title="Tornar a dictar"
                          >
                            <Volume2 size={36} />
                          </button>
                        </div>
                       )}
                     </div>

                     {wordRevealed && (
                       <div className="w-full flex flex-col items-center animate-fade-in-up">
                        <div className="flex flex-col sm:flex-row gap-6 w-full justify-center mb-8 px-4">
                          <button 
                            onClick={handleF3ToggleA} 
                            className={`flex-1 max-w-sm py-5 rounded-2xl font-black text-xl sm:text-2xl flex items-center justify-center gap-3 border-b-8 transition-all active:border-b-0 active:translate-y-2 shadow-lg ${
                              f3WordScored.A 
                                ? 'bg-blue-600 border-blue-800 text-white hover:bg-blue-500' 
                                : 'bg-slate-800/40 border-slate-700/60 text-slate-400 hover:bg-slate-800 hover:text-slate-300'
                            }`}
                          >
                            <Check size={28} className={f3WordScored.A ? 'text-white' : 'text-slate-500'}/> 
                            Encert Equip A {f3WordScored.A && <span className="text-xs bg-blue-900/65 px-2.5 py-0.5 rounded border border-blue-400/20 ml-1">+30</span>}
                          </button>
                          
                          <button 
                            onClick={handleF3ToggleB} 
                            className={`flex-1 max-w-sm py-5 rounded-2xl font-black text-xl sm:text-2xl flex items-center justify-center gap-3 border-b-8 transition-all active:border-b-0 active:translate-y-2 shadow-lg ${
                              f3WordScored.B 
                                ? 'bg-red-600 border-red-800 text-white hover:bg-red-500' 
                                : 'bg-slate-800/40 border-slate-700/60 text-slate-400 hover:bg-slate-800 hover:text-slate-300'
                            }`}
                          >
                            <Check size={28} className={f3WordScored.B ? 'text-white' : 'text-slate-500'}/> 
                            Encert Equip B {f3WordScored.B && <span className="text-xs bg-red-900/65 px-2.5 py-0.5 rounded border border-red-400/20 ml-1">+30</span>}
                          </button>
                         </div>
                         
                         <button onClick={handleF3Next} className="px-10 py-4 bg-yellow-500 hover:bg-yellow-400 text-indigo-900 rounded-full font-black text-xl flex items-center gap-3 shadow-xl hover:scale-105 transition-transform">
                            Següent Paraula <ArrowRight size={24}/>
                         </button>
                       </div>
                     )}
                  </div>
                )}

                {/* RESULTATS DE LA PARTIDA (PHASE 4) */}
                {phase === 4 && (
                  <div className="text-center animate-fade-in-up z-10">
                    <Confetti />
                    
                    <div className="mb-6 inline-block">
                      <Trophy size={120} className="text-yellow-400 drop-shadow-[0_0_30px_rgba(250,204,21,0.6)] mx-auto mb-6 animate-bounce" />
                    </div>
                    
                    <h2 className="text-5xl font-black text-white mb-4">I l'equip guanyador és...</h2>
                    
                    <div className={`text-8xl font-black mb-12 p-10 rounded-[3rem] inline-block shadow-[0_0_80px_rgba(255,255,255,0.2)] ${scoreA > scoreB ? 'bg-blue-600 text-white' : scoreB > scoreA ? 'bg-red-600 text-white' : 'bg-purple-600 text-white'}`}>
                      {scoreA > scoreB ? 'L\'EQUIP A!' : scoreB > scoreA ? 'L\'EQUIP B!' : 'EMPAT TÈCNIC!'}
                    </div>

                    <div className="flex justify-center gap-16 mb-16">
                      <div className="text-center">
                        <p className="text-xl text-blue-300 font-bold mb-2">Puntuació Final A</p>
                        <p className="text-5xl font-black">{scoreA} pts</p>
                      </div>
                      <div className="w-1 bg-white/20 rounded-full"></div>
                      <div className="text-center">
                        <p className="text-xl text-red-300 font-bold mb-2">Puntuació Final B</p>
                        <p className="text-5xl font-black">{scoreB} pts</p>
                      </div>
                    </div>

                    <div className="flex flex-wrap justify-center gap-6">
                      <button onClick={() => setPhase(5)} className="px-8 py-4 bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 rounded-full font-bold text-lg flex items-center gap-3 transition shadow-md">
                        <Eye size={24} /> Veure i Exportar Errors ({failedWords.length})
                      </button>
                      <button onClick={() => window.location.reload()} className="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-full font-bold text-lg flex items-center gap-3 transition shadow-md">
                        <RotateCcw size={24} /> Tornar a Jugar
                      </button>
                    </div>
                  </div>
                )}

                {/* REPÀS D'ERRORS I AVALUACIÓ (PHASE 5) */}
                {phase === 5 && (
                  <div className="w-full max-w-4xl mx-auto bg-slate-800/90 rounded-3xl p-10 shadow-2xl border border-slate-600 animate-fade-in-up">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                      <div>
                        <h2 className="text-4xl font-black text-white flex items-center gap-4">
                          <Eye className="text-yellow-400" size={40}/>
                          Repàs d'Errors (Gabarró)
                        </h2>
                        <p className="text-slate-400 mt-2 text-md">Visualització formativa dels errors registrats. Els alumnes han de fixar la imatge gràfica de la paraula correcta.</p>
                      </div>
                      
                      {failedWords.length > 0 && (
                        <button 
                          onClick={exportErrorsCSV}
                          className="flex items-center gap-2 py-3 px-5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm shadow-md transition-all active:scale-95"
                          title="Exporta la llista d'errors en format CSV per a fitxes de reforç"
                        >
                          <Download size={18} /> Exportar Errors CSV
                        </button>
                      )}
                    </div>
                    
                    {failedWords.length === 0 ? (
                      <div className="text-center py-16 text-2xl font-bold text-green-400 bg-slate-900/50 rounded-2xl border border-green-500/20">
                        Increïble! No hi ha hagut cap error en tota la partida! 🎉
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {failedWords.map((fw, idx) => (
                          <div key={idx} className="bg-slate-700/50 hover:bg-slate-750 text-white font-bold text-2xl py-4 px-6 rounded-xl text-center border-l-4 border-red-500 transition-colors flex items-center justify-between cursor-default group shadow-sm">
                            <span className="uppercase">{fw}</span>
                            <button 
                              onClick={() => speakWord(fw)}
                              className="p-1 text-slate-400 hover:text-yellow-400 transition opacity-0 group-hover:opacity-100 focus:opacity-100"
                              title="Escoltar pronunciació"
                            >
                              <Volume2 size={18} />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="mt-12 text-center border-t border-slate-700 pt-6">
                      <button onClick={() => setPhase(4)} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-full font-bold text-lg transition shadow-md">
                        Tornar als Resultats
                      </button>
                    </div>
                  </div>
                )}

              </main>

              {/* BARRA DE NAVEGACIÓ DEL DOCENT (CONTROL DE FASES I RETORN) */}
              {phase > 0 && (
                <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 bg-slate-900/90 border border-slate-700 backdrop-blur-md px-4 py-2 rounded-2xl shadow-2xl flex items-center justify-center gap-2 max-w-[95vw] overflow-x-auto">
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase mr-1 border-r border-slate-700/60 pr-2">🛠️ Control:</span>
                  <button 
                    onClick={() => {
                      if (confirm("Segur que vols tornar a la pantalla inicial? Es perdrà la partida actual.")) {
                        goToPhase(0);
                      }
                    }} 
                    className="flex items-center gap-1 px-2.5 py-1.5 bg-red-600/80 hover:bg-red-500 border border-red-500/20 text-white text-xs font-bold rounded-lg transition-all active:scale-95 whitespace-nowrap"
                    title="Tornar al menú principal i reiniciar marcadors"
                  >
                    🏠 Inici
                  </button>
                  <div className="w-px h-5 bg-slate-700/60 mx-1"></div>
                  <button 
                    onClick={() => goToPhase(1)} 
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 whitespace-nowrap ${phase === 1 ? 'bg-indigo-700 text-white border border-indigo-400/30' : 'bg-slate-800 text-slate-350 hover:text-white border border-slate-700/50'}`}
                    title="Anar a la Fase 1 (La Pluja de Lletres)"
                  >
                    Fase 1 (Pluja)
                  </button>
                  <button 
                    onClick={() => goToPhase(2)} 
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 whitespace-nowrap ${phase === 2 ? 'bg-indigo-700 text-white border border-indigo-400/30' : 'bg-slate-800 text-slate-350 hover:text-white border border-slate-700/50'}`}
                    title="Anar a la Fase 2 (El Rebot)"
                  >
                    Fase 2 (Rebot)
                  </button>
                  <button 
                    onClick={() => goToPhase(3)} 
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 whitespace-nowrap ${phase === 3 ? 'bg-indigo-700 text-white border border-indigo-400/30' : 'bg-slate-800 text-slate-350 hover:text-white border border-slate-700/50'}`}
                    title="Anar a la Fase 3 (La Gran Final)"
                  >
                    Fase 3 (Final)
                  </button>
                  <button 
                    onClick={() => goToPhase(4)} 
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 whitespace-nowrap ${phase === 4 ? 'bg-indigo-700 text-white border border-indigo-400/30' : 'bg-slate-800 text-slate-350 hover:text-white border border-slate-700/50'}`}
                    title="Anar a la Pantalla de Resultats"
                  >
                    🏆 Resultats
                  </button>
                  <button 
                    onClick={() => goToPhase(5)} 
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 whitespace-nowrap ${phase === 5 ? 'bg-indigo-700 text-white border border-indigo-400/30' : 'bg-slate-800 text-slate-350 hover:text-white border border-slate-700/50'}`}
                    title="Anar al Repàs d'Errors"
                  >
                    ⚠️ Errors
                  </button>
                </div>
              )}

              {/* PEU DE PÀGINA */}
              {(phase === 0 || phase === 6) && (
                <footer className="w-full py-6 mt-12 bg-black/40 text-center text-xs text-slate-300 border-t border-white/10 backdrop-blur-md">
                  <div className="flex flex-col items-center justify-center gap-1.5">
                    <p className="font-semibold">&copy; 2026 David Cordones</p>
                    <p className="flex items-center justify-center gap-2 flex-wrap">
                      <span>
                        Llicència del codi: <a href="LICENSE.txt" target="_blank" className="text-blue-400 hover:text-white transition-colors underline">AGPL v3</a>
                      </span>
                      <span className="opacity-50">·</span>
                      <span className="flex items-center gap-2">
                        Contingut:
                        <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer" className="text-blue-400 hover:text-white transition-colors underline flex items-center gap-1.5">
                          CC BY-SA 4.0
                          <span className="flex items-center gap-0.5 ml-0.5 bg-white px-1 py-0.5 rounded shadow-sm">
                            <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt="CC" className="h-3.5 opacity-90" />
                            <img src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1" alt="BY" className="h-3.5 opacity-90" />
                            <img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg?ref=chooser-v1" alt="SA" className="h-3.5 opacity-90" />
                          </span>
                        </a>
                      </span>
                    </p>
                  </div>
                </footer>
              )}

              <style>{`
                @keyframes fadeInUp {
                  from { opacity: 0; transform: translateY(20px); }
                  to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in-up {
                  animation: fadeInUp 0.6s ease-out forwards;
                }
              `}</style>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
